[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmms-export-cleaner"
version = "0.1.0"
description = "Normalize dates, status, priority and locations in messy CMMS CSV exports"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
